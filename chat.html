<!-- ================= CHAT ASSISTANT ================= -->
<div id="chatButton" title="Chat with Hanit Bakery Assistant">
    <div class="chat-btn-icon">💬</div>
    <span class="chat-badge">1</span>
    <div class="chat-tooltip">Need help? Ask us! 🍰</div>
</div>

<div id="chatWindow">
    <div id="chatHeader">
        <div class="chat-header-info">
            <div class="chat-avatar">🍰</div>
            <div>
                <div class="chat-title">Hanit Bakery Assistant</div>
                <div class="chat-status"><span class="status-dot"></span> Online • Responds Instantly</div>
            </div>
        </div>
        <button id="closeChat" aria-label="Close Chat">✕</button>
    </div>

    <div id="chatMessages">
        <div class="bot">
            <div class="msg-text">
                👋 Hello! Welcome to <strong>Hanit Bakery</strong>! I'm your virtual cake concierge.
                <br><br>
                How can I assist you today? Click a topic below or type your question:
            </div>
            <div class="chat-chips">
                <button class="chip" data-query="Cake prices">💰 Prices</button>
                <button class="chip" data-query="Flavors">🎂 Flavors</button>
                <button class="chip" data-query="Delivery info">🚚 Delivery</button>
                <button class="chip" data-query="Payment options">💳 Payment</button>
                <button class="chip" data-query="How to order">📋 How to Order</button>
            </div>
        </div>
    </div>

    <div id="chatInputArea">
        <input
            type="text"
            id="chatInput"
            placeholder="Type your question..."
            autocomplete="off"
        >
        <button id="sendBtn" aria-label="Send Message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>
